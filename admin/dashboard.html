<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Guru - BIM Learn</title>
    <link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .admin-heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.admin-heading h1{color:#1e293b;font-size:27px;margin:0 0 7px}.admin-heading p{color:#64748b;font-size:14px;margin:0}.admin-logout{border:1px solid #fecaca;background:#fff1f2;color:#b91c1c;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:600}.admin-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.admin-stat,.admin-panel{background:white;border:1px solid #e2e8f0;border-radius:13px}.admin-stat{padding:20px}.admin-stat i{color:#2563eb;font-size:19px}.admin-stat span{display:block;color:#64748b;font-size:12px;margin-top:13px}.admin-stat strong{display:block;color:#1e293b;font-size:25px;margin-top:5px}.admin-panel{padding:22px;margin-top:24px}.admin-panel h2{color:#1e293b;font-size:17px;margin:0 0 5px}.admin-panel p{color:#64748b;font-size:13px;margin:0}.quick-links{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}.quick-link{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid #e2e8f0;border-radius:9px;text-decoration:none;color:#334155;font-size:13px;font-weight:600}.quick-link i{color:#2563eb;font-size:18px}.admin-notice{display:none}@media(max-width:650px){.admin-stats,.quick-links{grid-template-columns:1fr}.admin-heading{align-items:flex-start;flex-direction:column;gap:15px}}
    </style>
</head>
<body data-admin-page="dashboard"><div id="admin-sidebar"></div><main class="main-content"><div class="admin-heading"><div><h1>Dashboard Guru</h1><p>Ringkasan pengelolaan pembelajaran BIM.</p></div><button class="admin-logout" id="admin-logout"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button></div><div id="admin-notice" class="admin-notice"></div><div class="admin-stats"><div class="admin-stat"><i class="fa-solid fa-users"></i><span>Total siswa</span><strong id="student-count">0</strong></div><div class="admin-stat"><i class="fa-solid fa-book-open"></i><span>Total materi</span><strong id="material-count">0</strong></div><div class="admin-stat"><i class="fa-solid fa-chart-line"></i><span>Rata-rata progres</span><strong id="progress-average">0%</strong></div></div><section class="admin-panel"><h2>Akses cepat</h2><p>Pilih menu untuk melanjutkan pekerjaan.</p><div class="quick-links"><a class="quick-link" href="materi.html"><i class="fa-solid fa-book"></i> Kelola materi</a><a class="quick-link" href="siswa.html"><i class="fa-solid fa-users"></i> Lihat progres siswa</a></div></section></main><script src="admin.js"></script><script>fetch("../admin_api.php",{credentials:"same-origin"}).then(response=>{if(response.status===403){location.href="login.html";return null}return response.json()}).then(result=>{if(!result||result.status!=="success")return;let students=result.data.students;document.getElementById("student-count").textContent=students.length;document.getElementById("material-count").textContent=result.data.material_count;let average=students.length?Math.round(students.reduce((sum,item)=>sum+Number(item.rata_rata),0)/students.length):0;document.getElementById("progress-average").textContent=average+"%"}).catch(()=>showAdminNotice("Dashboard gagal dimuat.","error"));</script></body>
</html>
