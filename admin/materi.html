<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=20261110-4">
    <title>Kelola Materi - BIM Learn</title>
    <link rel="stylesheet" href="../style.css?v=20261104-sidebar-toggle-3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .admin-heading{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px}
        .admin-heading h1{color:#1e293b;font-size:27px;margin:0 0 7px}
        .admin-heading p{color:#64748b;font-size:14px;margin:0}
        .admin-logout{border:1px solid #fecaca;background:#fff1f2;color:#b91c1c;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:600}
        .material-layout{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.2fr);gap:24px}
        .admin-panel{background:white;border:1px solid #e2e8f0;border-radius:13px;padding:22px}
        .admin-panel h2{color:#1e293b;font-size:17px;margin:0 0 5px}
        .admin-panel p{color:#64748b;font-size:13px;margin:0 0 18px}
        .material-form{display:grid;gap:13px}
        .material-form label{color:#334155;font-size:12px;font-weight:700}
        .material-form input,.material-form textarea,.material-form select{width:100%;box-sizing:border-box;margin-top:6px;border:1px solid #cbd5e1;border-radius:7px;padding:10px;font:inherit;font-size:13px}
        .material-form textarea{min-height:90px;resize:vertical}
        .material-form input:focus,.material-form textarea:focus,.material-form select:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
        .material-actions{display:flex;gap:8px}
        .admin-primary,.admin-secondary,.table-button{border:0;border-radius:7px;cursor:pointer;font-weight:700}
        .admin-primary{background:#2563eb;color:white;padding:10px 13px}
        .admin-secondary{background:#f1f5f9;color:#475569;padding:10px 13px}
        .material-list{display:grid;gap:10px}
        .material-item{border:1px solid #e2e8f0;border-radius:9px;padding:13px}
        .material-item h3{color:#1e293b;font-size:14px;margin:0 0 5px}
        .material-item p{color:#64748b;font-size:12px;margin:0 0 10px;line-height:1.4}
        .material-item small{color:#2563eb;font-weight:600}
        .material-item-actions{margin-top:10px;display:flex;gap:7px}
        .table-button{padding:6px 9px;font-size:11px}
        .edit-button{background:#dbeafe;color:#1d4ed8}
        .delete-button{background:#fee2e2;color:#b91c1c}
        .admin-empty{color:#94a3b8;font-size:13px}
        @media(max-width:850px){.material-layout{grid-template-columns:1fr}}
        @media(max-width:650px){.admin-heading{align-items:flex-start;flex-direction:column;gap:15px}}
    </style>
</head>
<body data-admin-page="materi">
    <div id="admin-sidebar"></div>
    <main class="main-content">
        <div class="admin-heading">
            <div>
                <h1>Kelola Materi</h1>
                <p>Tambah, edit, dan publikasikan materi untuk siswa.</p>
            </div>
            <button class="admin-logout" id="admin-logout"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
        </div>

        <div id="admin-notice" style="display:none"></div>
        <div id="delete-confirm-box" style="display:none; margin-bottom:16px; padding:12px 14px; border:1px solid #fecaca; background:#fff1f2; color:#b91c1c; border-radius:8px; align-items:center; justify-content:space-between; gap:12px;">
            <span>Yakin ingin menghapus materi ini?</span>
            <div style="display:flex; gap:8px;">
                <button type="button" id="confirm-delete-btn" class="table-button delete-button">Hapus</button>
                <button type="button" id="cancel-delete-btn" class="table-button edit-button">Batal</button>
            </div>
        </div>

        <div class="material-layout">
            <section class="admin-panel">
                <h2 id="form-title">Tambah Materi</h2>
                <p>Isi informasi materi pembelajaran.</p>
                <form class="material-form" id="material-form">
                    <input type="hidden" id="material-id">
                    <label>Modul<select id="material-modul" required>
                        <option value="1">Modul 1</option>
                        <option value="2">Modul 2</option>
                        <option value="3">Modul 3</option>
                        <option value="4">Modul 4</option>
                    </select></label>
                    <label>Judul materi<input id="material-title" required></label>
                    <label>Ringkasan<textarea id="material-summary" required></textarea></label>
                    <label>Kategori<input id="material-category" value="BIM" required></label>
                    <label>Isi materi<textarea id="material-content" required></textarea></label>
                    <label>Link YouTube (opsional)<input id="material-video" type="url" maxlength="500" placeholder="https://www.youtube.com/watch?v=..."></label>
                    <label><input id="material-published" type="checkbox" checked> Publikasikan materi</label>
                    <div class="material-actions">
                        <button class="admin-primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
                        <button class="admin-secondary" id="cancel-edit" type="button" style="display:none">Batal</button>
                    </div>
                </form>
            </section>

            <section class="admin-panel">
                <h2>Daftar Materi</h2>
                <p>Materi yang tersimpan di sistem.</p>
                <div class="material-list" id="material-list"></div>
            </section>
        </div>
    </main>

    <script src="admin.js?v=20261104-sidebar-toggle-3"></script>
    <script>
        let materials = [];
        let deleteTargetId = null;

        function loadMaterials() {
            fetch("../materi_api.php", { credentials: "same-origin" })
                .then(response => {
                    if (response.status === 403) {
                        location.href = "login.html";
                        return null;
                    }
                    return response.json();
                })
                .then(result => {
                    if (!result || result.status !== "success") return;
                    materials = result.data;
                    let list = document.getElementById("material-list");
                    list.replaceChildren();

                    materials.forEach(item => {
                        let card = document.createElement("article");
                        card.className = "material-item";

                        let title = document.createElement("h3");
                        title.textContent = item.judul;

                        let summary = document.createElement("p");
                        summary.textContent = item.ringkasan;

                        let category = document.createElement("small");
                        category.textContent = item.kategori + (Number(item.published) ? " · Dipublikasikan" : " · Draft");

                        let actions = document.createElement("div");
                        actions.className = "material-item-actions";

                        let edit = document.createElement("button");
                        edit.className = "table-button edit-button";
                        edit.textContent = "Edit";
                        edit.onclick = () => editMaterial(item.id);

                        let remove = document.createElement("button");
                        remove.className = "table-button delete-button";
                        remove.textContent = "Hapus";
                        remove.onclick = () => deleteMaterial(item.id);

                        actions.append(edit, remove);
                        card.append(title, summary, category, actions);
                        list.appendChild(card);
                    });

                    if (!materials.length) list.innerHTML = '<p class="admin-empty">Belum ada materi.</p>';
                })
                .catch(() => showAdminNotice("Materi gagal dimuat.", "error"));
        }

        function editMaterial(id) {
            let item = materials.find(value => Number(value.id) === Number(id));
            if (!item) return;

            document.getElementById("material-id").value = item.id;
            document.getElementById("material-modul").value = item.modul || 1;
            document.getElementById("material-title").value = item.judul;
            document.getElementById("material-summary").value = item.ringkasan;
            document.getElementById("material-category").value = item.kategori;
            document.getElementById("material-content").value = item.isi;
            document.getElementById("material-video").value = item.video_url || "";
            document.getElementById("material-published").checked = Number(item.published) === 1;

            document.getElementById("form-title").textContent = "Edit Materi";
            document.getElementById("cancel-edit").style.display = "inline-block";
        }

        function resetForm() {
            document.getElementById("material-form").reset();
            document.getElementById("material-id").value = "";
            document.getElementById("material-modul").value = 1;
            document.getElementById("material-category").value = "BIM";
            document.getElementById("form-title").textContent = "Tambah Materi";
            document.getElementById("cancel-edit").style.display = "none";
        }

        function deleteMaterial(id) {
            deleteTargetId = id;
            document.getElementById("delete-confirm-box").style.display = "flex";
        }

        document.getElementById("confirm-delete-btn").addEventListener("click", function() {
            if (!deleteTargetId) return;
            fetch("../materi_api.php?id=" + deleteTargetId, {
                method: "DELETE",
                credentials: "same-origin"
            })
            .then(response => response.json())
            .then(result => {
                document.getElementById("delete-confirm-box").style.display = "none";
                showAdminNotice(result.message, result.status);
                deleteTargetId = null;
                loadMaterials();
            })
            .catch(() => {
                document.getElementById("delete-confirm-box").style.display = "none";
                showAdminNotice("Materi gagal dihapus.", "error");
            });
        });

        document.getElementById("cancel-delete-btn").addEventListener("click", function() {
            deleteTargetId = null;
            document.getElementById("delete-confirm-box").style.display = "none";
        });

        document.getElementById("material-form").addEventListener("submit", function(event) {
            event.preventDefault();
            let body = new FormData();
            body.append("id", document.getElementById("material-id").value);
            body.append("modul", document.getElementById("material-modul").value);
            body.append("judul", document.getElementById("material-title").value);
            body.append("ringkasan", document.getElementById("material-summary").value);
            body.append("kategori", document.getElementById("material-category").value);
            body.append("isi", document.getElementById("material-content").value);
            body.append("video_url", document.getElementById("material-video").value);
            if (document.getElementById("material-published").checked) body.append("published", "1");

            fetch("../materi_api.php", { method: "POST", body, credentials: "same-origin" })
                .then(response => response.json())
                .then(result => {
                    showAdminNotice(result.message, result.status);
                    if (result.status === "success") {
                        resetForm();
                        loadMaterials();
                    }
                })
                .catch(() => showAdminNotice("Materi gagal disimpan.", "error"));
        });

        document.getElementById("cancel-edit").addEventListener("click", resetForm);
        loadMaterials();
    </script>
</body>
</html>
