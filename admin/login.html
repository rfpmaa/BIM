<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Guru - BIM Learn</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .admin-login-page { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #eef2f7; }
        .admin-login-card { width: min(420px, 100%); background: white; border: 1px solid #e2e8f0; border-radius: 14px; padding: 34px; box-shadow: 0 12px 30px rgba(15, 23, 42, .08); }
        .admin-login-brand { text-align: center; margin-bottom: 28px; }
        .admin-login-brand i { color: #2563eb; font-size: 38px; margin-bottom: 12px; }
        .admin-login-brand h1 { color: #1e293b; font-size: 23px; margin: 0 0 7px; }
        .admin-login-brand p { color: #64748b; font-size: 13px; margin: 0; }
        .admin-field { margin-bottom: 17px; }
        .admin-field label { display: block; color: #334155; font-size: 13px; font-weight: 600; margin-bottom: 7px; }
        .admin-field input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
        .admin-field input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
        .admin-login-button { width: 100%; border: 0; border-radius: 8px; padding: 12px; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
        .admin-login-button:hover { background: #1d4ed8; }
        .admin-login-note { min-height: 18px; margin-bottom: 14px; color: #b91c1c; font-size: 13px; text-align: center; }
        .admin-back-link { display: block; margin-top: 18px; color: #64748b; font-size: 13px; text-align: center; text-decoration: none; }
    </style>
</head>
<body class="admin-login-page">
    <main class="admin-login-card">
        <div class="admin-login-brand"><i class="fa-solid fa-chalkboard-user"></i><h1>Portal Guru</h1><p>Kelola materi dan pantau progres siswa.</p></div>
        <form id="admin-login-form">
            <div class="admin-field"><label for="admin-email">Email Guru</label><input id="admin-email" type="email" autocomplete="email" required></div>
            <div class="admin-field"><label for="admin-password">Password</label><input id="admin-password" type="password" autocomplete="current-password" required></div>
            <div id="admin-login-note" class="admin-login-note" role="alert"></div>
            <button class="admin-login-button" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Masuk sebagai Guru</button>
        </form>
        <a class="admin-back-link" href="../user/login.html">Kembali ke login siswa</a>
    </main>
    <script>
        document.getElementById("admin-login-form").addEventListener("submit", function(event) {
            event.preventDefault();
            let note = document.getElementById("admin-login-note");
            let body = new FormData(event.currentTarget);
            fetch("../admin_login.php", { method: "POST", body: body, credentials: "same-origin" })
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") window.location.href = "dashboard.html";
                    else note.textContent = data.message;
                })
                .catch(() => note.textContent = "Server tidak dapat dihubungi.");
        });
    </script>
</body>
</html>
