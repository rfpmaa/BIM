<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - BIM Learn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; /* Background abu-abu kebiruan lembut */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .logo-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-header i {
            font-size: 40px;
            color: #4F46E5;
            margin-bottom: 10px;
        }
        .logo-header h2 {
            margin: 0;
            color: #1e293b;
            font-size: 24px;
        }
        .logo-header p {
            color: #64748b;
            font-size: 14px;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus {
            border-color: #4F46E5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 45px;
        }
        .toggle-password {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            padding: 4px;
        }
        .toggle-password:hover,
        .toggle-password:focus {
            color: #4F46E5;
        }
        .btn-submit {
            background: #4F46E5;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #4338ca;
        }
        .toggle-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }
        .toggle-text a {
            color: #4F46E5;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }
        .toggle-text a:hover {
            text-decoration: underline;
        }
        .admin-link {
            text-align: center;
            margin-top: 14px;
            font-size: 12px;
        }
        .admin-link a {
            color: #64748b;
            text-decoration: none;
        }
        .admin-link a:hover {
            color: #4F46E5;
            text-decoration: underline;
        }
        .notif-box {
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            display: none; /* Sembunyikan dari awal */
        }
        .notif-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #f87171;
        }
        .notif-success {
            background-color: #dcfce3;
            color: #166534;
            border: 1px solid #4ade80;
        }
    </style>
</head>
<body>

    <!-- KOTAK LOGIN -->
    <div class="login-card" id="box-login">
        <div class="logo-header">
            <i class="fa-solid fa-cube"></i>
            <h2>BIM Learn</h2>
            <p>Silakan masuk ke akun Anda</p>
        </div>

        <div id="notif-login" class="notif-box"></div> 

        
        <form onsubmit="prosesLogin(event)">
            <div class="form-group">
                <label><i class="fa-solid fa-envelope"></i> Alamat Email</label>
                <input type="email" id="login-email" placeholder="Masukkan email" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> Password</label>
                <div class="password-wrapper">
                    <input type="password" id="login-password" placeholder="Masukkan password" autocomplete="current-password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('login-password', this)" aria-label="Tampilkan password" title="Tampilkan password">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-submit">Masuk Sekarang</button>
        </form>
        
        <div class="toggle-text">
            Belum punya akun? <a onclick="toggleForm()">Daftar di sini</a>
        </div>
        <div class="admin-link"><a href="../admin/login.html">Masuk sebagai guru</a></div>
    </div>

    <!-- KOTAK REGISTER (Disembunyikan secara default) -->
    <div class="login-card" id="box-register" style="display: none;">
        <div class="logo-header">
            <i class="fa-solid fa-user-plus"></i>
            <h2>Buat Akun</h2>
            <p>Mulai perjalanan BIM Anda</p>
        </div>

        <div id="notif-register" class="notif-box"></div>

        
        <form onsubmit="prosesRegister(event)">
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> Nama Lengkap</label>
                <input type="text" id="reg-nama" placeholder="Masukkan nama" autocomplete="name" minlength="2" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-envelope"></i> Alamat Email</label>
                <input type="email" id="reg-email" placeholder="Masukkan email" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> Password</label>
                <div class="password-wrapper">
                    <input type="password" id="reg-password" placeholder="Buat password" autocomplete="new-password" minlength="8" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('reg-password', this)" aria-label="Tampilkan password" title="Tampilkan password">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="reg-password-confirm"><i class="fa-solid fa-lock"></i> Konfirmasi Password</label>
                <div class="password-wrapper">
                    <input type="password" id="reg-password-confirm" placeholder="Ulangi password" autocomplete="new-password" minlength="8" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('reg-password-confirm', this)" aria-label="Tampilkan password" title="Tampilkan password">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-submit">Daftar Sekarang</button>
        </form>
        
        <div class="toggle-text">
            Sudah punya akun? <a onclick="toggleForm()">Masuk di sini</a>
        </div>
    </div>

    <script>
        // Fungsi baru untuk menampilkan notifikasi dalam card
function tampilkanNotif(elementId, status, pesan) {
    let notifEl = document.getElementById(elementId);
    notifEl.style.display = "block";
    notifEl.innerText = pesan;
    
    if (status === "success") {
        notifEl.className = "notif-box notif-success";
    } else {
        notifEl.className = "notif-box notif-error";
    }
}

document.addEventListener("DOMContentLoaded", function() {
    let savedNotification = sessionStorage.getItem("pageNotification");
    if (!savedNotification) return;

    let notification = JSON.parse(savedNotification);
    tampilkanNotif("notif-login", notification.status, notification.message);
    sessionStorage.removeItem("pageNotification");
});

function toggleForm() {
    let boxLogin = document.getElementById("box-login");
    let boxReg = document.getElementById("box-register");
    
    // Sembunyikan notifikasi saat ganti form
    document.getElementById("notif-login").style.display = "none";
    document.getElementById("notif-register").style.display = "none";

    if (boxLogin.style.display === "none") {
        boxLogin.style.display = "block";
        boxReg.style.display = "none";
    } else {
        boxLogin.style.display = "none";
        boxReg.style.display = "block";
    }
}

function togglePassword(inputId, button) {
    let passwordInput = document.getElementById(inputId);
    let isPasswordHidden = passwordInput.type === "password";

    passwordInput.type = isPasswordHidden ? "text" : "password";
    button.innerHTML = isPasswordHidden
        ? '<i class="fa-solid fa-eye-slash"></i>'
        : '<i class="fa-solid fa-eye"></i>';
    button.setAttribute("aria-label", isPasswordHidden ? "Sembunyikan password" : "Tampilkan password");
    button.setAttribute("title", isPasswordHidden ? "Sembunyikan password" : "Tampilkan password");
}

function prosesRegister(e) {
    e.preventDefault();
    let password = document.getElementById("reg-password").value;
    let passwordConfirm = document.getElementById("reg-password-confirm").value;
    if (password !== passwordConfirm) {
        tampilkanNotif("notif-register", "error", "Konfirmasi password tidak cocok.");
        return;
    }
    if (password.length < 8) {
        tampilkanNotif("notif-register", "error", "Password minimal 8 karakter.");
        return;
    }
    let formData = new FormData();
    formData.append("nama", document.getElementById("reg-nama").value);
    formData.append("email", document.getElementById("reg-email").value);
    formData.append("password", password);

    fetch("../register.php", { method: "POST", body: formData })
    .then(response => response.json())
    .then(data => {
        if(data.status === "success") {
            tampilkanNotif("notif-register", "success", data.message + " Mengalihkan ke login...");
            setTimeout(() => toggleForm(), 2000); // Pindah ke form login setelah 2 detik
        } else {
            tampilkanNotif("notif-register", "error", data.message);
        }
    })
    .catch(() => tampilkanNotif("notif-register", "error", "Server tidak dapat dihubungi. Coba lagi."));
}

function prosesLogin(e) {
    e.preventDefault();
    let formData = new FormData();
    formData.append("email", document.getElementById("login-email").value);
    formData.append("password", document.getElementById("login-password").value);

    // Tampilkan pesan loading sementara memproses
    tampilkanNotif("notif-login", "success", "Memeriksa data...");

    fetch("../login.php", { method: "POST", body: formData })
    .then(response => response.json())
    .then(data => {
        if(data.status === "success") {
            // Bersihkan cache profil akun sebelumnya sebelum memuat profil akun ini.
            localStorage.removeItem("fotoProfil");
            localStorage.removeItem("namaUser");
            localStorage.removeItem("emailUser");
            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("userId", data.data.id);
            localStorage.setItem("namaUser", data.data.nama);
            localStorage.setItem("emailUser", data.data.email);
            
            tampilkanNotif("notif-login", "success", "Login berhasil! Mengalihkan...");
            setTimeout(() => window.location.href = "index.html", 1000); // Jeda 1 detik agar user bisa baca
        } else {
            tampilkanNotif("notif-login", "error", data.message);
        }
    })
    .catch(() => tampilkanNotif("notif-login", "error", "Server tidak dapat dihubungi. Coba lagi."));
}
    </script>
</body>
</html>
