<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Belajar - BIM Learn</title>
    <link rel="stylesheet" href="../style.css?v=20261104-responsive">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .progress-header { margin-bottom: 25px; }
        .progress-header h1 { color: #1e293b; font-size: 28px; margin: 0 0 8px; }
        .progress-header p { color: #64748b; font-size: 14px; margin: 0; }
        .progress-overview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 22px; }
        .overview-item, .progress-list { background: white; border: 1px solid #e2e8f0; border-radius: 14px; }
        .overview-item { padding: 20px; }
        .overview-item span { color: #64748b; font-size: 12px; }
        .overview-item strong { display: block; color: #1e293b; font-size: 24px; margin-top: 7px; }
        .progress-list { padding: 8px 22px; max-width: 800px; }
        .progress-row { padding: 18px 0; border-bottom: 1px solid #f1f5f9; }
        .progress-row:last-child { border-bottom: 0; }
        .progress-row-head { display: flex; justify-content: space-between; color: #334155; font-size: 14px; font-weight: 600; margin-bottom: 9px; }
        .progress-row-head span:last-child { color: #2563eb; }
        .progress-track { height: 8px; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
        .progress-value { height: 100%; background: #2563eb; border-radius: inherit; width: 0; }
        @media (max-width: 650px) { .progress-overview { grid-template-columns: 1fr; } .progress-list { padding: 8px 16px; } }
    </style>
</head>
<body class="student-page">
    <div class="sidebar"><div class="logo"><i class="fa-solid fa-cube"></i><span>BIM Learn</span></div><ul>
        <li><a href="index.html"><i class="fa-solid fa-house"></i> Beranda</a></li><li><a href="modul.html"><i class="fa-solid fa-book"></i> Modul</a></li><li><a href="latihan.html"><i class="fa-solid fa-clipboard-check"></i> Latihan</a></li><li><a href="pengumpulan-tugas.html"><i class="fa-solid fa-file-arrow-up"></i> Pengumpulan Tugas</a></li><li><a href="progres.html" class="active"><i class="fa-solid fa-chart-line"></i> Progress</a></li><li><a href="profil.html"><i class="fa-solid fa-user"></i> Profil</a></li>
    </ul></div>
    <main class="main-content"><div class="progress-header"><h1>Progress Belajar</h1><p>Pantau perjalananmu menyelesaikan seluruh modul BIM.</p></div><div class="progress-overview"><div class="overview-item"><span>Modul selesai</span><strong id="completed-count">0/4</strong></div><div class="overview-item"><span>Progress rata-rata</span><strong id="average-progress">0%</strong></div><div class="overview-item"><span>Status belajar</span><strong id="learning-status">Mulai</strong></div></div><div class="progress-list" id="progress-list"></div></main>
    <script src="../script.js?v=20261007-sidebar-flow"></script><script>
        let moduleNames = ["Pengenalan BIM", "Pemodelan 3D", "Kolaborasi & BIM 360", "Manajemen Proyek"];
        function renderProgress(values) {
            let total = 0;
            let completed = 0;
            let list = document.getElementById("progress-list");
            list.replaceChildren();
            moduleNames.forEach(function(name, index) {
                let value = Number(values[index] || 0);
                total += value;
                if (value >= 100) completed++;
                let row = document.createElement("div");
                row.className = "progress-row";
                row.innerHTML = '<div class="progress-row-head"><span>' + (index + 1) + '. ' + name + '</span><span>' + value + '%</span></div><div class="progress-track"><div class="progress-value" style="width:' + value + '%"></div></div>';
                list.appendChild(row);
            });
            document.getElementById("completed-count").textContent = completed + "/4";
            document.getElementById("average-progress").textContent = Math.round(total / 4) + "%";
            document.getElementById("learning-status").textContent = completed === 4 ? "Selesai" : completed > 0 ? "Berjalan" : "Mulai";
        }
        fetch("../progress_api.php?t=" + Date.now(), { credentials: "same-origin", cache: "no-store" }).then(response => response.json()).then(result => {
            let values = [0, 0, 0, 0];
            if (result.status === "success") result.data.forEach(item => values[Number(item.modul) - 1] = Number(item.progress));
            renderProgress(values);
        }).catch(() => renderProgress([0, 0, 0, 0]));
    </script>
</body>
</html>
